[package]
name = "valkey-array"
version = "0.0.1"
keywords = ["valkey", "array"]
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/somechris/valkey-array"
readme = "README.md"
description = "An array module for Valkey"

[features]
default = ["min-valkey-compatibility-version-8-0"]
# This feature needs to be available for `valkey-module` `0.1.14` when adding acls
min-valkey-compatibility-version-8-0 = ["valkey-module/min-valkey-compatibility-version-8-0"]

[dependencies]
fast-glob = "1.1.1"
regex = "1.13.1"
valkey-module = "0.1.14"

[dev-dependencies]
valkey-module = { version = "0.1.14", features=["enable-system-alloc", "test-shims"] }
redis = "2.0.0-rc.1"
redis-test = "2.0.0-rc.1"
assertables = "10.1.0"
rstest = "0.27.0"

[lib]
crate-type = ["cdylib"]
name = "valkey_array"

[lints.clippy]
uninlined_format_args = "warn"  # To get more readable format strings
print_stderr = "warn"  # To avoid committing debug statements
print_stdout = "warn"  # To avoid committing debug statements
wildcard_imports = "warn"  # Wildcard imports make it hard to see where entities are from
unwrap_used = "warn"  # To enforce proper error handling
expect_used = "warn"  # To enforce proper error handling
panic_in_result_fn = "warn"  # To enforce proper error handling
panic = "warn"  # To enforce proper error handling
redundant_clone = "warn"  # To get rid of redundancies
redundant_type_annotations = "warn"  # To get rid of redundancies

[lints.rust]
missing_docs = "warn"  # Yay for documentation

[patch.crates-io]
redis = { git = 'https://github.com/redis-rs/redis-rs.git', rev = 'f43d4e0cf50c10fc6b76e216c7ff6a0a55c8c3ce' }
redis-test = { git = 'https://github.com/redis-rs/redis-rs.git', rev = 'f43d4e0cf50c10fc6b76e216c7ff6a0a55c8c3ce' }
